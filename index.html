<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Web App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Android Web App Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4a040b">
    
    <title>iOS 26 Simulator - Fullscreen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Global Customization Variables */
            --wallpaper-color: #4a040b; 
            --icon-tint-rgb: 255, 77, 77;
            
            /* Light Mode */
            --icon-bg: linear-gradient(180deg, rgba(var(--icon-tint-rgb), 0.9) 0%, rgba(var(--icon-tint-rgb), 0.5) 100%);
            --icon-color: #ffffff;
            --icon-border: rgba(255, 255, 255, 0.4);
            --icon-reflection: linear-gradient(to bottom, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
            
            /* Dock */
            --dock-bg: rgba(255, 255, 255, 0.15);
            --dock-border: rgba(255, 255, 255, 0.3);
            
            /* Control Center Light */
            --cc-bg: rgba(255, 255, 255, 0.2);
            --cc-module-bg: rgba(255, 255, 255, 0.3);
            --cc-active: rgb(var(--icon-tint-rgb));
            --cc-icon: #ffffff;
            --cc-slider-bg: rgba(255, 255, 255, 0.4);

            /* Settings App */
            --settings-bg: #f2f2f7;
            --settings-text: #000;
            --settings-card: #fff;
            --settings-border: #d1d1d6;
        }

        /* Dark Mode overrides */
        .device.dark-mode {
            --icon-bg: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.8) 100%);
            --icon-color: rgb(var(--icon-tint-rgb)); 
            --icon-border: rgba(var(--icon-tint-rgb), 0.3);
            --icon-reflection: linear-gradient(to bottom, rgba(var(--icon-tint-rgb), 0.15) 0%, rgba(0,0,0,0) 100%);
            
            --dock-bg: rgba(0, 0, 0, 0.4);
            --dock-border: rgba(var(--icon-tint-rgb), 0.15);
            
            --cc-bg: rgba(0, 0, 0, 0.5);
            --cc-module-bg: rgba(0, 0, 0, 0.6);
            --cc-active: rgb(var(--icon-tint-rgb));
            --cc-icon: rgb(var(--icon-tint-rgb));
            --cc-slider-bg: rgba(0, 0, 0, 0.6);

            --settings-bg: #000000;
            --settings-text: #ffffff;
            --settings-card: #1c1c1e;
            --settings-border: #38383a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; height: 100dvh;
            background-color: #1a1a1a; overflow: hidden; 
        }

        /* Device Wrapper */
        .device {
            width: 375px; height: 812px;
            background-color: var(--wallpaper-color);
            border-radius: 50px; border: 8px solid #222;
            position: relative; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: background-color 0.4s ease;
        }

        /* Full Screen Mobile Breakpoint */
        @media screen and (max-width: 600px) {
            body { background-color: var(--wallpaper-color); }
            .device {
                width: 100vw; height: 100dvh;
                border: none; border-radius: 0;
                box-shadow: none;
            }
            .dynamic-island { top: env(safe-area-inset-top, 15px); }
            .status-bar { padding-top: calc(env(safe-area-inset-top, 0px) + 22px); }
            .home-indicator { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
            .control-center { padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
            .settings-app { padding-top: calc(env(safe-area-inset-top, 0px) + 60px); }
        }

        .dynamic-island {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 35px; background-color: #000;
            border-radius: 20px; z-index: 50;
        }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 22px 25px 0 25px; color: #fff; font-size: 14px; font-weight: 600;
            z-index: 40; position: relative; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .status-right { display: flex; gap: 5px; cursor: pointer; padding: 5px; border-radius: 10px; }

        .home-screen { display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 20px 15px; padding: 40px 20px; }
        .app-container { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-container:active .app-icon { transform: scale(0.85); }

        .app-icon {
            width: 60px; height: 60px; border-radius: 16px; position: relative;
            display: flex; justify-content: center; align-items: center;
            color: var(--icon-color); font-size: 26px;
            background: var(--icon-bg); border: 1px solid var(--icon-border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); overflow: hidden; transition: all 0.4s ease;
        }
        .app-icon::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: var(--icon-reflection); border-radius: 16px 16px 50% 50%; pointer-events: none; transition: all 0.4s ease;
        }
        .app-label { margin-top: 6px; color: #fff; font-size: 11px; font-weight: 500; }

        .dock {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 85px; background: var(--dock-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 30px; display: flex; justify-content: space-around; align-items: center;
            padding: 0 10px; border: 1px solid var(--dock-border); transition: all 0.4s ease;
        }
        .dock .app-label { display: none; }

        /* Overlays */
        .control-center, .settings-app {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .control-center {
            background: var(--cc-bg); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            opacity: 0; pointer-events: none; transform: translateY(-100%);
            padding: 80px 20px 20px 20px; display: flex; flex-direction: column; gap: 15px;
        }
        .control-center.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .cc-row { display: flex; gap: 15px; height: 150px; }
        .cc-module {
            background: var(--cc-module-bg); border-radius: 24px;
            flex: 1; display: flex; flex-wrap: wrap; padding: 15px; gap: 10px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 10px 20px rgba(0,0,0,0.2);
        }
        .cc-toggle {
            width: calc(50% - 5px); height: calc(50% - 5px);
            background: var(--cc-slider-bg); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: var(--cc-icon); font-size: 18px; cursor: pointer; transition: 0.2s;
        }
        .cc-toggle.active { background: var(--cc-active); color: #fff; }
        .cc-media { align-items: center; justify-content: center; flex-direction: column; color: var(--cc-icon); }
        
        .cc-sliders-row { display: flex; gap: 15px; height: 140px; }
        .cc-slider { flex: 1; background: var(--cc-slider-bg); border-radius: 20px; position: relative; overflow: hidden; display: flex; align-items: flex-end; }
        .cc-slider-fill { width: 100%; height: 70%; background: #fff; }
        .device.dark-mode .cc-slider-fill { background: var(--cc-active); }
        .cc-slider i { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); color: #888; font-size: 20px; z-index: 2; }
        .device.dark-mode .cc-slider i { color: #000; }

        .settings-app {
            background-color: var(--settings-bg); z-index: 35; color: var(--settings-text);
            top: 100%; padding-top: 60px;
        }
        .settings-app.open { top: 0; }
        .settings-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-size: 28px; font-weight: bold; }
        .close-btn { font-size: 16px; color: #007aff; font-weight: 500; cursor: pointer; }
        .settings-group { background: var(--settings-card); margin: 20px; border-radius: 12px; overflow: hidden; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--settings-border); font-size: 16px; }
        .settings-item:last-child { border-bottom: none; }

        input[type="color"] { -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; padding: 0; background: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid var(--settings-border); border-radius: 50%; }

        .home-indicator {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 130px; height: 5px; background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px; z-index: 60; cursor: pointer;
        }
        .device.dark-mode .home-indicator { background-color: var(--settings-text); }
    </style>
</head>
<body>

    <div class="device" id="simulator">
        <div class="dynamic-island"></div>
        
        <div class="status-bar">
            <div id="clock">9:41</div>
            <div class="status-right" onclick="toggleControlCenter(true)">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- App Grid -->
        <div class="home-screen">
            <div class="app-container"><div class="app-icon"><i class="fa-solid fa-comment"></i></div><div class="app-label">Messages</div></div>
            
            <!-- FULLSCREEN APP (Click this to hide browser URL bar) -->
            <div class="app-container" onclick="toggleFullScreen()">
                <div class="app-icon"><i class="fa-solid fa-expand"></i></div>
                <div class="app-label">Fullscreen</div>
            </div>

            <div class="app-container"><div class="app-icon"><i class="fa-solid fa-image"></i></div><div class="app-label">Photos</div></div>
            <div class="app-container"><div class="app-icon"><i class="fa-solid fa-camera"></i></div><div class="app-label">Camera</div></div>
            
            <div class="app-container" onclick="toggleDarkMode()">
                <div class="app-icon"><i class="fa-solid fa-moon"></i></div>
                <div class="app-label">Dark Mode</div>
            </div>
            
            <div class="app-container"><div class="app-icon"><i class="fa-solid fa-map"></i></div><div class="app-label">Maps</div></div>
            <div class="app-container"><div class="app-icon"><i class="fa-solid fa-note-sticky"></i></div><div class="app-label">Notes</div></div>
            
            <div class="app-container" onclick="toggleSettings(true)">
                <div class="app-icon"><i class="fa-solid fa-gear"></i></div>
                <div class="app-label">Settings</div>
            </div>
        </div>

        <!-- Dock -->
        <div class="dock">
            <div class="app-container"><div class="app-icon"><i class="fa-solid fa-phone"></i></div></div>
            <div class="app-container"><div class="app-icon"><i class="fa-solid fa-envelope"></i></div></div>
            <div class="app-container"><div class="app-icon"><i class="fa-regular fa-compass"></i></div></div>
            <div class="app-container"><div class="app-icon"><i class="fa-solid fa-music"></i></div></div>
        </div>

        <!-- Control Center -->
        <div class="control-center" id="controlCenter">
            <div class="cc-row">
                <div class="cc-module">
                    <div class="cc-toggle" onclick="this.classList.toggle('active')"><i class="fa-solid fa-plane"></i></div>
                    <div class="cc-toggle active" onclick="this.classList.toggle('active')"><i class="fa-solid fa-wifi"></i></div>
                    <div class="cc-toggle active" onclick="this.classList.toggle('active')"><i class="fa-brands fa-bluetooth-b"></i></div>
                    <div class="cc-toggle active" onclick="this.classList.toggle('active')"><i class="fa-solid fa-signal"></i></div>
                </div>
                <div class="cc-module cc-media">
                    <div style="font-size: 12px; margin-bottom: 15px; opacity: 0.7;">Not Playing</div>
                    <div style="display: flex; gap: 15px; font-size: 20px;">
                        <i class="fa-solid fa-backward-step"></i><i class="fa-solid fa-play"></i><i class="fa-solid fa-forward-step"></i>
                    </div>
                </div>
            </div>
            <div class="cc-sliders-row">
                <div class="cc-slider"><div class="cc-slider-fill" style="height: 80%;"></div><i class="fa-solid fa-sun"></i></div>
                <div class="cc-slider"><div class="cc-slider-fill" style="height: 50%;"></div><i class="fa-solid fa-volume-high"></i></div>
            </div>
        </div>

        <!-- Settings App -->
        <div class="settings-app" id="settingsApp">
            <div class="settings-header">Settings<div class="close-btn" onclick="toggleSettings(false)">Done</div></div>
            <div class="settings-group">
                <div class="settings-item"><span>Wallpaper Color</span><input type="color" id="wallpaperPicker" value="#4a040b"></div>
                <div class="settings-item"><span>Icon Tint Color</span><input type="color" id="tintPicker" value="#ff4d4d"></div>
            </div>
        </div>

        <div class="home-indicator" onclick="closeOverlays()"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours() % 12 || 12;
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }
        updateClock(); setInterval(updateClock, 1000);

        // --- NEW FULLSCREEN API LOGIC ---
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Enter fullscreen
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                }
            }
        }

        function toggleDarkMode() { document.getElementById('simulator').classList.toggle('dark-mode'); }
        function toggleControlCenter(open) {
            const cc = document.getElementById('controlCenter');
            if (open) cc.classList.add('open'); else cc.classList.remove('open');
        }
        function toggleSettings(open) {
            const settingsUI = document.getElementById('settingsApp');
            if(open) settingsUI.classList.add('open'); else settingsUI.classList.remove('open');
        }
        function closeOverlays() { toggleControlCenter(false); toggleSettings(false); }
        
        function hexToRgb(hex) {
            hex = hex.replace(/^#/, '');
            if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
            const num = parseInt(hex, 16);
            return `${num >> 16}, ${(num >> 8) & 255}, ${num & 255}`;
        }

        document.getElementById('wallpaperPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--wallpaper-color', e.target.value);
            document.body.style.backgroundColor = e.target.value;
            document.querySelector('meta[name="theme-color"]').setAttribute("content", e.target.value);
        });
        document.getElementById('tintPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--icon-tint-rgb', hexToRgb(e.target.value));
        });
    </script>
</body>
</html>
